<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Val | Portafolio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="#inicio">Inicio</a>
    <a href="#sobre-mi">Sobre mí</a>
    <a href="#proyectos">Proyectos</a>
    <a href="#contacto">Contacto</a>
  </nav>

  <section id="inicio" class="hero">
    <div class="hero-text">
      <h1 id="hero-name"></h1>
      <p id="hero-role"></p>
    </div>

    <div class="character">
      <img class="layer" src="assets/img/layer1.png" alt="">
      <img class="layer" src="assets/img/layer2.png" alt="">
      <img class="layer iris-layer" src="assets/img/layer3.png" alt="Personaje con ojos que siguen el cursor">
    </div>
  </section>

  <section id="sobre-mi">
    <h2>Sobre mí</h2>
    <p id="about-text"></p>
    <ul id="skills-list" class="skills"></ul>
  </section>

  <section id="proyectos">
    <h2>Proyectos</h2>
    <div id="projects-grid" class="projects-grid"></div>
  </section>

  <section id="contacto">
    <h2>Contacto</h2>
    <ul id="contact-links" class="contact"></ul>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
